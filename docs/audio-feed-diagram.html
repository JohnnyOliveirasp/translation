<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Qu-6D Audio Feed — Connection Options</title>
<style>
  body { margin: 0; background: #fff; font-family: 'Segoe UI', system-ui, sans-serif; }
  #art { width: 980px; }
</style>
</head>
<body>
<div id="art">
<svg viewBox="0 0 980 760" xmlns="http://www.w3.org/2000/svg">
  <rect width="980" height="760" fill="#ffffff"/>

  <!-- title -->
  <text x="490" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#111827">
    Audio Feed for the Live Translation System
  </text>
  <text x="490" y="74" text-anchor="middle" font-size="15" fill="#6b7280">
    Allen &amp; Heath Qu-6D  →  Translation computer &nbsp;·&nbsp; two connection options
  </text>

  <!-- ============ OPTION A ============ -->
  <rect x="30" y="100" width="920" height="270" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <rect x="30" y="100" width="920" height="44" rx="14" fill="#16a34a"/>
  <rect x="30" y="128" width="920" height="16" fill="#16a34a"/>
  <text x="52" y="129" font-size="17" font-weight="700" fill="#ffffff">OPTION A — Direct USB-C  (recommended · no extra hardware · one cable)</text>

  <!-- mixer -->
  <g>
    <rect x="70" y="180" width="300" height="130" rx="10" fill="#1f2937"/>
    <text x="220" y="210" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">ALLEN &amp; HEATH  Qu-6D</text>
    <text x="220" y="230" text-anchor="middle" font-size="12" fill="#9ca3af">(sound board — rear panel)</text>
    <!-- knobs -->
    <circle cx="105" cy="258" r="8" fill="#4b5563"/><circle cx="135" cy="258" r="8" fill="#4b5563"/>
    <circle cx="165" cy="258" r="8" fill="#4b5563"/><circle cx="195" cy="258" r="8" fill="#4b5563"/>
    <circle cx="225" cy="258" r="8" fill="#4b5563"/><circle cx="255" cy="258" r="8" fill="#4b5563"/>
    <!-- usb-c port highlighted -->
    <rect x="290" y="248" width="52" height="20" rx="10" fill="#111827" stroke="#f59e0b" stroke-width="3"/>
    <text x="316" y="262" text-anchor="middle" font-size="10" font-weight="700" fill="#f59e0b">USB-C</text>
    <text x="316" y="292" text-anchor="middle" font-size="11" fill="#fbbf24">← the port circled in the photo</text>
  </g>

  <!-- cable -->
  <line x1="370" y1="245" x2="600" y2="245" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/>
  <polygon points="600,245 586,237 586,253" fill="#16a34a"/>
  <text x="485" y="230" text-anchor="middle" font-size="13" font-weight="600" fill="#15803d">USB-C  ↔  USB-C cable</text>

  <!-- laptop -->
  <g>
    <rect x="612" y="185" width="180" height="105" rx="8" fill="#1f2937"/>
    <rect x="622" y="195" width="160" height="75" rx="4" fill="#3b82f6" opacity="0.85"/>
    <text x="702" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">TRANSLATION</text>
    <text x="702" y="245" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">SYSTEM</text>
    <rect x="592" y="290" width="220" height="10" rx="5" fill="#374151"/>
    <text x="702" y="322" text-anchor="middle" font-size="12" fill="#374151">Laptop running the translation</text>
  </g>

  <!-- option A notes -->
  <text x="70" y="338" font-size="12.5" fill="#166534">✓ Mixer setting: SETUP → Audio → Sync&amp;USB → USB Mode: <tspan font-weight="700">Stereo</tspan> &nbsp;·&nbsp; send Main L/R to USB 1-2</text>
  <text x="70" y="358" font-size="12.5" fill="#166534">✓ The board then appears on the computer as a standard audio device (class-compliant — no driver needed)</text>

  <!-- ============ OPTION B ============ -->
  <rect x="30" y="395" width="920" height="290" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="30" y="395" width="920" height="44" rx="14" fill="#2563eb"/>
  <rect x="30" y="423" width="920" height="16" fill="#2563eb"/>
  <text x="52" y="424" font-size="17" font-weight="700" fill="#ffffff">OPTION B — Line output + USB audio interface  (fallback if the USB-C port is unavailable)</text>

  <!-- mixer -->
  <g>
    <rect x="70" y="480" width="240" height="120" rx="10" fill="#1f2937"/>
    <text x="190" y="508" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Qu-6D</text>
    <text x="190" y="526" text-anchor="middle" font-size="12" fill="#9ca3af">(sound board)</text>
    <!-- xlr outs -->
    <circle cx="238" cy="560" r="13" fill="#111827" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="272" cy="560" r="13" fill="#111827" stroke="#f59e0b" stroke-width="3"/>
    <text x="255" y="590" text-anchor="middle" font-size="11" fill="#fbbf24">ALT OUT L/R</text>
  </g>

  <!-- xlr cables -->
  <line x1="310" y1="555" x2="440" y2="555" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <line x1="310" y1="567" x2="440" y2="567" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <polygon points="440,561 427,553 427,569" fill="#2563eb"/>
  <text x="375" y="541" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d4ed8">2 × XLR cables</text>

  <!-- interface -->
  <g>
    <rect x="452" y="515" width="170" height="90" rx="10" fill="#7f1d1d"/>
    <text x="537" y="548" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">USB AUDIO</text>
    <text x="537" y="566" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">INTERFACE</text>
    <text x="537" y="586" text-anchor="middle" font-size="10.5" fill="#fca5a5">e.g. Focusrite Scarlett 2i2</text>
    <circle cx="478" cy="530" r="7" fill="#991b1b"/><circle cx="500" cy="530" r="7" fill="#991b1b"/>
  </g>

  <!-- usb cable -->
  <line x1="622" y1="558" x2="720" y2="558" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <polygon points="720,558 706,550 706,566" fill="#2563eb"/>
  <text x="671" y="543" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d4ed8">USB-C</text>

  <!-- laptop -->
  <g>
    <rect x="732" y="500" width="160" height="95" rx="8" fill="#1f2937"/>
    <rect x="741" y="509" width="142" height="68" rx="4" fill="#3b82f6" opacity="0.85"/>
    <text x="812" y="538" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">TRANSLATION</text>
    <text x="812" y="554" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">SYSTEM</text>
    <rect x="714" y="595" width="196" height="9" rx="4.5" fill="#374151"/>
    <text x="812" y="625" text-anchor="middle" font-size="12" fill="#374151">Laptop</text>
  </g>

  <!-- option B notes -->
  <text x="70" y="655" font-size="12.5" fill="#1e40af">✓ Any spare stereo output works (ALT OUT, AES OUT or a Mix out) — the interface converts the analog signal to USB for the computer</text>

  <!-- footer -->
  <text x="490" y="720" text-anchor="middle" font-size="13.5" font-weight="600" fill="#374151">
    Both options are LISTEN-ONLY: nothing is sent back to the board and the house sound is not affected in any way.
  </text>
  <text x="490" y="742" text-anchor="middle" font-size="12" fill="#9ca3af">
    Live Translation System — Redeem Community Church
  </text>
</svg>
</div>
</body>
</html>
